; =========================================================
;  AI-Hotkeys — configurazione
;  Dopo una modifica: icona di AI-Hotkeys nella barra -> "Ricarica"
; =========================================================

[qwen]
; Modello di Ollama da usare (scaricalo con: ollama pull qwen3.5:9b)
;
; Il tag "qwen3.5:9b" è GIÀ quantizzato Q4_K_M (6.6 GB) ed è la scelta
; giusta per una scheda da 12 GB: lascia spazio al contesto e a Windows.
; Il tag "qwen3.5:9b-q8_0" (10 GB) su 12 GB sta troppo stretto e finirebbe
; in parte nella RAM di sistema, diventando circa dieci volte più lento.
model = qwen3.5:9b
ollama_url = http://localhost:11434

; Quanto Ollama tiene il modello pronto in memoria dopo l'ultima richiesta.
; Il default di Ollama è 5 minuti: passato quel tempo il modello viene
; scaricato e la pressione successiva aspetta il ricaricamento (10-20 s).
; Finché il modello è in memoria occupa VRAM (circa 8 GB con il contesto),
; ma NON usa la GPU: il carico sale al 100% solo nei secondi in cui scrive.
; Per liberare la VRAM prima di giocare: tasto destro sull'icona ✦ nella
; barra delle applicazioni -> "Libera la VRAM".
;   30m  = pronto per mezz'ora (consigliato)
;   10m  = compromesso se usi la GPU anche per altro
;   -1   = sempre pronto, non si scarica mai da solo
;   0    = scarica appena ha finito, ogni pressione paga il caricamento
keep_alive = 30m

[searxng]
; Ricerca web per il tasto End (spiega): prima di spiegare, AI-Hotkeys
; cerca sul web con SearXNG, legge le prime pagine e le passa a Qwen.
; Nella spiegazione le informazioni prese dal web hanno il numero della
; fonte, [1] [2]..., cliccabile, e in fondo c'è l'elenco delle fonti.
;
; SearXNG gira sul tuo PC (cartella searxng) e parte insieme ad AI-Hotkeys.
; Si può usare anche dal browser: http://127.0.0.1:8888
;
; Non si cerca per ogni testo: prima Qwen decide se c'è qualcosa da cercare.
; Per un pensiero, un'opinione o un appunto personale non serve, e le pagine
; trovate a forza farebbero finire la spiegazione fuori tema.
;   web_search = auto    cerca solo quando serve (consigliato)
;   web_search = always  cerca sempre, anche quando non serve
;   web_search = false   mai: End spiega solo con il testo selezionato
web_search = auto
searxng_url = http://127.0.0.1:8888

; Quanti risultati passare a Qwen e di quanti leggere la pagina intera
; (gli altri solo con l'anteprima). Più pagine = più contesto ma più lento.
results = 5
pages_to_read = 3

[aspetto]
; Aspetto della pagina dei risultati e delle impostazioni.
; Si cambia più comodamente da: icona di AI-Hotkeys -> Impostazioni.
;   tema      scuro, nero, chiaro, sistema (segue Windows)
;   colore    ambra, ghiaccio, menta, corallo, viola, neutro
;   testo     dimensione del testo in pixel, da 14 a 20
;   larghezza della colonna di lettura: stretta, normale, ampia
tema = scuro
colore = ambra
testo = 16
larghezza = normale
; Testo selezionato mostrato accanto al risultato (si / no)
mostra_originale = si
; Fumetto vicino al mouse mentre Qwen lavora (si / no)
avanzamento = si

[tasti]
; Tasti delle tre azioni, nella sintassi di AutoHotkey:
;   ^ = Ctrl   ! = Alt   + = Maiusc   # = Win      es. ^!r = Ctrl+Alt+R
; Lettere e numeri da soli non sono ammessi: servono per scrivere.
correggi = PgUp
riassumi = PgDn
spiega = End

[comportamento]
; PgUp sostituisce direttamente il testo selezionato in Blocco note,
; Obsidian, Word, VS Code e Notepad++ (si). Con "no" apre la pagina.
; PgDn ed End aprono sempre la pagina dei risultati.
sostituisci_testo = si
; Lunghezza di riassunti e spiegazioni: breve, normale, dettagliata
lunghezza = normale

[obsidian]
; File che PgUp riorganizza quando è aperto in Obsidian
; Esempio: todo_file = %USERPROFILE%\Documents\To-Do List.md
todo_file = %USERPROFILE%\Documents\To-Do List.md

; Inizio del titolo della finestra di Obsidian quando quel file è aperto:
; "<nome nota> - <nome vault> - Obsidian"
; Esempio: window_title = To-Do List - IlMioVault - Obsidian
window_title = To-Do List -
