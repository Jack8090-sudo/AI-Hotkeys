<!DOCTYPE html>
<html lang="en" translate="no" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="no-referrer">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>__TITLE__ - AI-Hotkeys</title>

<style>/*__THEME__*/</style>

<style>
/* =========================================================
   Results page
   ========================================================= */

/* keep the focused element above the sticky question bar */
html { scroll-padding-bottom: 190px; }

.wrap {
    width: min(100% - 48px, calc(300px + 56px + var(--measure)));
    margin: 0 auto;
}

/* ---------- header: the pressed key and the action ---------- */

.top { padding: 36px 0 26px; border-bottom: 1px solid var(--line); }

.top .wrap {
    display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center;
    gap: 22px;
}

.key { animation: press .55s var(--ease) .1s both; }

@keyframes press {
    0%   { transform: translateY(0); color: var(--muted); text-shadow: none; }
    35%  { transform: translateY(3px); }
    100% { transform: translateY(0); }
}

h1 {
    margin: 0;
    font-family: var(--f-ui);
    font-weight: 600;
    font-size: calc(var(--fs) * 2.4);
    line-height: 1;
    letter-spacing: .005em;
}

.meta {
    display: flex;
    flex-wrap: wrap;
    gap: 4px 18px;
    margin: 10px 0 0;
    color: var(--muted);
    font-size: calc(var(--fs) * .84);
}

.meta q { color: var(--text-2); quotes: "«" "»"; }

.tools { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

/* ---------- buttons ---------- */

.btn {
    height: 34px;
    padding: 0 13px;
    border: 1px solid var(--edge);
    border-radius: 7px;
    background: transparent;
    color: var(--text);
    font: 500 calc(var(--fs) * .9)/1 var(--f-ui);
    letter-spacing: .01em;
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
}
.btn:hover { background: var(--surface-2); }
.btn.done { border-color: var(--accent); color: var(--accent); }
.btn.toggle[aria-pressed="false"] { color: var(--muted); border-style: dashed; }
.btn.toggle[aria-pressed="true"] { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
.btn[hidden] { display: none; }

/* two-or-more-position group (Result / Changes, versions) */
.seg {
    display: inline-flex;
    padding: 2px;
    border: 1px solid var(--edge);
    border-radius: 8px;
}
.seg[hidden] { display: none; }
.seg button {
    height: 28px;
    padding: 0 11px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--muted);
    font: 500 calc(var(--fs) * .88)/1 var(--f-ui);
    cursor: pointer;
}
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--surface-2); color: var(--text); }

/* ---------- body: selected text on the side, result in the center ---------- */

.page {
    display: grid;
    grid-template-columns: 300px minmax(0, var(--measure));
    gap: 56px;
    align-items: start;
    padding: 34px 0 40px;
}

.page > .rail { grid-column: 1; grid-row: 1; }
.page > .reading { grid-column: 2; grid-row: 1; }
.page.no-rail { grid-template-columns: minmax(0, var(--measure)); }
.page.no-rail .rail { display: none; }
.page.no-rail > .reading { grid-column: 1; }

/* without the side column everything shrinks onto the reading column */
body.narrow .wrap { width: min(100% - 48px, var(--measure)); }

.rail {
    position: sticky;
    top: 24px;
    max-height: calc(100vh - 48px);
    overflow: auto;
    padding-right: 6px;
    scrollbar-width: thin;
    scrollbar-color: var(--line-2) transparent;
}

.rail h2 {
    margin: 0 0 12px;
    font: 500 calc(var(--fs) * .88)/1.2 var(--f-ui);
    color: var(--muted);
    letter-spacing: .01em;
}

.rail .md {
    color: var(--text-2);
    font-size: calc(var(--fs) * .875);
    line-height: 1.6;
    border-left: 2px solid var(--line-2);
    padding-left: 14px;
}

.reading { min-width: 0; }
.result, .turn .md { color: var(--body); }

.result { animation: appear .35s var(--ease) .25s both; }
@keyframes appear { from { opacity: 0; } to { opacity: 1; } }

/* ---------- formatted text (Markdown) ---------- */

.md > :first-child { margin-top: 0; }
.md > :last-child { margin-bottom: 0; }

.md p { margin: 0 0 1em; }

.md h1, .md h2, .md h3 {
    font-family: var(--f-ui);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: .01em;
    color: var(--text);
}
.md h1, .md h2 { margin: 1.9em 0 .55em; font-size: calc(var(--fs) * 1.3); }
.md h3 { margin: 1.6em 0 .5em; font-size: calc(var(--fs) * 1.12); }
.md h4, .md h5, .md h6 { margin: 1.4em 0 .4em; font-size: var(--fs); }

.md strong { font-weight: 600; color: var(--text); }
.md em { font-style: italic; }

.md a { color: var(--accent); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 3px; }
.md a:hover { text-decoration-thickness: 2px; }

.md ul, .md ol { margin: .3em 0 1.1em; padding-left: 1.3em; }
.md li { margin: .35em 0; }
.md li::marker { color: var(--muted); }

.md code {
    padding: .12em .38em;
    border-radius: 4px;
    background: var(--surface-2);
    font-family: var(--f-code);
    font-size: .88em;
    overflow-wrap: anywhere;
}

.md pre {
    margin: 1.2em 0;
    padding: 14px 16px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--surface);
    overflow-x: auto;
}
.md pre code { padding: 0; background: none; font-size: calc(var(--fs) * .82); line-height: 1.6; overflow-wrap: normal; }

.md blockquote {
    margin: 1.2em 0;
    padding: 2px 0 2px 16px;
    border-left: 2px solid var(--line-2);
    color: var(--text-2);
}

.md hr { border: 0; border-top: 1px solid var(--line); margin: 2em 0; }

.md table { width: 100%; border-collapse: collapse; margin: 1.2em 0; font-size: .92em; display: block; overflow-x: auto; }
.md th, .md td { padding: 8px 12px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
.md th { font-family: var(--f-ui); font-weight: 600; color: var(--text); }

.md li:has(> input[type="checkbox"]) { list-style: none; margin-left: -1.3em; }
.md input[type="checkbox"] { accent-color: var(--accent); margin: 0 .5em 0 0; }

/* [1] citations in the text */
.md a.cite {
    position: relative;
    top: -.45em;
    margin-left: 1px;
    font: 600 .7em/1 var(--f-ui);
    text-decoration: none;
}
.md a.cite:hover { text-decoration: underline; }

/* answer cut off (K4 "partial"): marked as incomplete, not only by colour */
.partial-note {
    margin: 1em 0 0;
    padding: 6px 12px;
    border: 1px dashed var(--danger);
    border-radius: 6px;
    color: var(--text);
    font-size: calc(var(--fs) * .88);
}
.partial-note strong { color: var(--danger); }

/* "Technical terms": glossary */
.md ul.terms { list-style: none; padding-left: 0; }
.md ul.terms li { margin: 0 0 .7em; }
.md ul.terms li > strong:first-child { font-family: var(--f-ui); font-weight: 600; font-size: 1.04em; }

/* "Things to watch": warnings */
.md .watch {
    margin: .2em 0 1.2em;
    padding: 2px 0 2px 16px;
    border-left: 2px solid var(--accent);
}

/* sources list */
.md ul.sources { list-style: none; padding: 0; margin-top: .4em; }
.md ul.sources li {
    display: grid;
    grid-template-columns: 2.1em minmax(0, 1fr);
    gap: 2px 6px;
    margin: 0 0 .75em;
    line-height: 1.4;
}
.md .src-n { font: 600 .9em/1.55 var(--f-ui); color: var(--accent); }
.md .src-meta { grid-column: 2; color: var(--muted); font-size: .84em; }
.md h2.sec-sources { font-size: calc(var(--fs) * 1.05); color: var(--text-2); }
.md h2.sec-sources.other { color: var(--muted); }
.md ul.sources.other a { color: var(--text-2); }
.md ul.sources.other .src-n { color: var(--muted); }

/* cursor while the AI is writing */
.md .tail { display: contents; }
.md.streaming > .tail > :last-child::after {
    content: "";
    display: inline-block;
    width: .5em;
    height: 1.05em;
    margin-left: 2px;
    vertical-align: -.18em;
    background: var(--accent);
    animation: caret 1s steps(2, jump-none) infinite;
}
@keyframes caret { 50% { opacity: 0; } }

/* changes comparison (PgUp) */
.diff { white-space: pre-wrap; overflow-wrap: anywhere; }
.diff del { color: var(--danger); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.diff ins { text-decoration: none; background: var(--tint); color: var(--text); border-bottom: 1.5px solid var(--accent); }

.note {
    margin: 0 0 18px;
    color: var(--muted);
    font-size: calc(var(--fs) * .86);
}
.note q { color: var(--text-2); quotes: "«" "»"; }
.note[hidden] { display: none; }

/* ---------- follow-up questions ---------- */

.thread[hidden] { display: none; }

.turn { margin-top: 44px; padding-top: 26px; border-top: 1px solid var(--line); }

.ask-line {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin: 0 0 16px;
}

.ask-line p {
    margin: 0;
    padding-left: 14px;
    border-left: 2px solid var(--accent);
    color: var(--text);
    font-family: var(--f-ui);
    font-weight: 500;
    font-size: calc(var(--fs) * 1.12);
    line-height: 1.35;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.waiting { color: var(--muted); }
.error-text { color: var(--danger); }

/* ---------- question bar ---------- */

.dock {
    position: sticky;
    bottom: 0;
    z-index: 10;
    margin-top: 40px;
    padding: 14px 0 18px;
    background: linear-gradient(to bottom, transparent, var(--bg) 14px);
}

.composer {
    position: relative;
    padding: 10px;
    border: 1px solid var(--line-2);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
    min-width: 0;
}

.progress {
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left;
}
.composer.busy .progress { animation: work 1.6s var(--ease) infinite; }
@keyframes work {
    0%   { transform: scaleX(0); transform-origin: left; }
    50%  { transform: scaleX(1); transform-origin: left; }
    50.1%{ transform-origin: right; }
    100% { transform: scaleX(0); transform-origin: right; }
}

.suggest { display: flex; gap: 6px; margin: 0 0 8px; overflow-x: auto; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button {
    flex: none;
    height: 28px;
    padding: 0 10px;
    border: 1px solid var(--edge);
    border-radius: 6px;
    background: transparent;
    color: var(--text-2);
    font: 500 calc(var(--fs) * .84)/1 var(--f-ui);
    cursor: pointer;
}
.suggest button:hover { color: var(--text); background: var(--surface-2); }

.row { display: flex; align-items: flex-end; gap: 8px; }

.row textarea {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    max-height: 180px;
    padding: 10px 12px;
    border: 1px solid var(--edge);
    border-radius: 8px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    line-height: 1.45;
    resize: none;
}
.row textarea::placeholder { color: var(--muted); }
.row textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.row textarea[readonly] { color: var(--muted); }

.send {
    height: 42px;
    min-width: 76px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: var(--on-accent);
    font: 600 var(--fs)/1 var(--f-ui);
    letter-spacing: .01em;
    cursor: pointer;
}
.send:hover { filter: brightness(1.06); }
.send:disabled { opacity: .5; cursor: default; filter: none; }
.suggest[hidden] { display: none; }
.composer.busy .send { background: var(--surface-2); color: var(--text); }

.status {
    min-height: 0;
    margin: 0;
    color: var(--muted);
    font-size: calc(var(--fs) * .82);
}
.status:not(:empty) { margin-top: 8px; }
.status.error, .alert { color: var(--danger); }
.alert { margin: 0; font-size: calc(var(--fs) * .82); }
.alert:not(:empty) { margin-top: 8px; }

/* ---------- narrow screens ---------- */

@media (max-width: 900px) {
    .wrap { width: min(100% - 28px, var(--measure)); }
    .top { padding-top: 22px; }
    .top .wrap { grid-template-columns: auto minmax(0, 1fr); align-items: start; gap: 16px; }
    .tools { grid-column: 1 / -1; justify-content: flex-start; }
    .page { grid-template-columns: minmax(0, 1fr); gap: 26px; padding-top: 24px; }
    .page > .rail, .page > .reading, .page.no-rail > .reading { grid-column: 1; grid-row: auto; }
    .rail { position: static; max-height: 40vh; order: -1; }
    h1 { font-size: calc(var(--fs) * 1.9); }
    .key { min-width: 64px; height: 58px; font-size: 18px; }
}

/* small windows and high zoom: the question bar scrolls with the page instead of covering it */
@media (max-width: 640px), (max-height: 560px) {
    html { scroll-padding-bottom: 0; }
    .dock { position: static; background: none; }
    .row { flex-wrap: wrap; }
    .row textarea { flex-basis: 12em; }
}

@media (forced-colors: active) {
    .progress, .md.streaming > .tail > :last-child::after { background: CanvasText; }
    .send { border: 1px solid ButtonText; }
    .partial-note { border-color: CanvasText; }
    .diff ins { border-bottom-color: CanvasText; }
}
</style>
</head>

<body>

<p class="offline" id="offline" role="alert" hidden></p>

<header class="top">
    <div class="wrap">
        <div class="keys" id="keys" aria-hidden="true"></div>
        <div>
            <h1 id="title"></h1>
            <p class="meta" id="meta"></p>
        </div>
        <div class="tools">
            <div class="seg" id="viewSeg" role="group" aria-label="View" hidden>
                <button type="button" data-view="result" aria-pressed="true">Result</button>
                <button type="button" data-view="diff" aria-pressed="false">Changes</button>
            </div>
            <div class="seg" id="versions" role="group" aria-label="Versions" hidden></div>
            <button type="button" class="btn toggle" id="toggleRail" aria-controls="rail" aria-pressed="true" title="Show or hide the selected text">Selected text</button>
            <button type="button" class="btn" id="copyResult" aria-label="Copy result">Copy</button>
        </div>
    </div>
</header>

<main class="wrap page" id="page">

    <div class="reading">
        <h2 class="sr-only" id="resultTitle">Result</h2>
        <p class="note" id="versionNote" hidden></p>
        <article class="md result" id="result" aria-labelledby="resultTitle"></article>

        <section class="thread" id="thread" aria-label="Follow-up questions" hidden></section>

        <div class="dock">
        <form class="composer" id="askForm" autocomplete="off">
            <div class="progress" aria-hidden="true"></div>
            <div class="suggest" id="suggest" role="group" aria-label="Suggested questions"></div>
            <div class="row">
                <label class="sr-only" for="askInput">Ask AI</label>
                <textarea id="askInput" rows="1" spellcheck="true" aria-describedby="askStatus askError"></textarea>
                <button type="submit" class="send" id="askSend">Send</button>
            </div>
            <p class="status" id="askStatus" role="status" aria-live="polite"></p>
            <p class="alert" id="askError" role="alert"></p>
        </form>
        </div>
    </div>

    <aside class="rail" id="rail" aria-labelledby="railTitle">
        <h2 id="railTitle">Selected text</h2>
        <div class="md" id="original"></div>
    </aside>

</main>


<script>/*__MARKED__*/</script>

<script>
"use strict";

const DATA = /*__DATA__*/null;
// The token stays in DATA: remove it from the address bar and the history.
try { history.replaceState(null, "", location.pathname); } catch (e) {}

/* ================= APPEARANCE (from config.ini) ================= */

const root = document.documentElement;
const look = DATA.look || {};
root.dataset.theme = { scuro: "dark", nero: "black", chiaro: "light", sistema: "auto" }[look.tema] || "dark";
root.dataset.accent = look.colore || "ambra";
root.dataset.width = look.larghezza || "normale";
if (look.testo) root.style.setProperty("--fs", look.testo + "px");


/* ================= PER-MODE TEXTS ================= */

const MODE_UI = {
    rewrite: {
        title: "Fix",
        key: "PgUp",
        placeholder: "Ask for a change, for example: make it more formal",
        busy: "The AI is writing a new version.",
        suggest: [
            ["More formal", "Use a more formal and professional tone."],
            ["Shorter", "Make the text shorter and more concise, without losing important information."],
            ["Simpler", "Make the text easier to understand."],
            ["Bullet points", "Organize the text into a clear bulleted list."]
        ]
    },
    summarize: {
        title: "Summary",
        key: "PgDn",
        placeholder: "Ask something about the text",
        busy: "The AI is answering.",
        suggest: [
            ["The most important point", "What is the most important point?"],
            ["Even shorter", "Give me an even shorter summary, in 2-3 sentences."],
            ["What should I do?", "Are there actions or next steps I need to take? List them."],
            ["Problems described", "What problems are described in the text?"]
        ]
    },
    explain: {
        title: "Explanation",
        key: "End",
        placeholder: "Ask for more detail",
        busy: "The AI is answering.",
        suggest: [
            ["A practical example", "Give me a practical example."],
            ["Simpler", "Explain it to me even more simply."],
            ["Main problems", "What are the main problems?"],
            ["What is missing?", "What is missing or unclear in the text?"]
        ]
    }
};

const ui = MODE_UI[DATA.mode] || MODE_UI.rewrite;
const isRewrite = DATA.mode === "rewrite";

const $ = (id) => document.getElementById(id);
const form = $("askForm");
const askInput = $("askInput");
const askSend = $("askSend");
const askStatus = $("askStatus");
const askError = $("askError");
const resultEl = $("result");

const state = {
    versions: [{ text: DATA.result, request: null }],
    current: 0,
    view: "result",
    busy: false,
    controller: null
};


/* ================= MARKDOWN ================= */

const escapeHtml = (s) => String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

marked.use({
    gfm: true,
    breaks: true,
    renderer: {
        // No raw HTML: it is shown as text.
        html(html) { return escapeHtml(typeof html === "object" ? html.text : html); },
        // Remote images are never loaded (a web page read by the search could use
        // one to send text away): they become a link. The page's CSP blocks them too.
        image(href, title, text) {
            if (href && typeof href === "object") ({ href, title, text } = href);
            href = String(href || "");
            if (/^data:image\//i.test(href)) return `<img src="${escapeHtml(href)}" alt="${escapeHtml(text || "")}">`;
            if (!/^https?:\/\//i.test(href)) return escapeHtml(text || "");
            let host = href;
            try { host = new URL(href).hostname.replace(/^www\./, ""); } catch (e) {}
            return `<a href="${escapeHtml(href)}">Image: ${escapeHtml(text || host)}</a>`;
        }
    }
});

function renderMarkdown(el, text) {
    el.innerHTML = marked.parse(text || "");
    el.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href") || "";
        if (!/^https?:\/\//i.test(href)) { a.removeAttribute("href"); return; }
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        const cite = /^\[(\d+)\]$/.exec(a.textContent.trim());
        if (cite) {
            a.classList.add("cite");
            try { a.title = new URL(href).hostname.replace(/^www\./, ""); } catch (e) { a.title = href; }
            a.setAttribute("aria-label", "Source " + cite[1] + ": " + a.title);
        }
    });
    // Only inline data: images may stay (remote ones were turned into links above)
    el.querySelectorAll("img[src]").forEach((img) => {
        if (!/^data:image\//i.test(img.getAttribute("src") || "")) img.removeAttribute("src");
    });
    shapeSections(el);
}

/* The sections the AI always writes get their own styling:
   glossary for terms, colored indent for warnings,
   ordered list for sources. */
function shapeSections(el) {
    el.querySelectorAll("h2, h3").forEach((h) => {
        const name = h.textContent.trim().toLowerCase();
        const next = h.nextElementSibling;

        if (/^(termini|terms)/.test(name) && next && next.tagName === "UL") {
            next.classList.add("terms");
        }

        if (/(da tenere d'occhio|things to watch|watch out)/.test(name)) {
            const box = document.createElement("div");
            box.className = "watch";
            let n = h.nextElementSibling;
            while (n && !/^H[1-3]$/.test(n.tagName)) {
                const following = n.nextElementSibling;
                box.appendChild(n);
                n = following;
            }
            h.after(box);
        }

        if (/^(fonti|sources|altre pagine lette|other pages read|pagine lette|pages read)$/.test(name) && next && next.tagName === "UL") {
            const other = name !== "fonti" && name !== "sources";
            h.classList.add("sec-sources");
            next.classList.add("sources");
            if (other) { h.classList.add("other"); next.classList.add("other"); }
            next.querySelectorAll(":scope > li").forEach(shapeSource);
        }
    });
}

function shapeSource(li) {
    const link = li.querySelector("a");
    if (!link) return;
    const strong = li.querySelector("strong");
    const n = strong ? strong.textContent.replace(/[\[\]\s]/g, "") : "";
    // after the link: "(domain, type)" or the old " · domain · type"
    const tail = li.textContent.split(link.textContent).pop()
        .replace(/^[\s·(]+|[\s)]+$/g, "")
        .replace(/\s*·\s*/g, ", ");
    const num = document.createElement("span");
    num.className = "src-n";
    num.textContent = n;
    const meta = document.createElement("span");
    meta.className = "src-meta";
    meta.textContent = tail;
    const a = link.cloneNode(true);
    li.replaceChildren(num, a, meta);
}


/* ================= HEADER ================= */

function keyLabels() {
    const raw = (DATA.key || ui.key).trim();
    return raw.split(/\s*\+\s*/).filter(Boolean);
}

function renderKeys() {
    const box = $("keys");
    const labels = keyLabels();
    labels.forEach((label, i) => {
        const k = document.createElement("span");
        k.className = "key" + (i < labels.length - 1 ? " mod" : "");
        const s = document.createElement("span");
        s.textContent = label;
        k.appendChild(s);
        box.appendChild(k);
    });
}

const ORIGINAL = (DATA.original || "").trim();
const SHORT_ORIGINAL = ORIGINAL.length <= 120 && !ORIGINAL.includes("\n");

function renderMeta() {
    const m = DATA.meta || {};
    const parts = [];
    if (SHORT_ORIGINAL) {
        const span = document.createElement("span");
        span.append("Selected text: ");
        const q = document.createElement("q");
        q.textContent = ORIGINAL;
        span.append(q);
        parts.push(span);
    } else {
        const chars = ORIGINAL.length;
        parts.push(chars.toLocaleString("it-IT") + " selected characters");
    }
    if (m.query && m.query.length) {
        const span = document.createElement("span");
        span.append("Searched the web: ");
        m.query.forEach((q, i) => {
            if (i) span.append(" and ");
            const qq = document.createElement("q");
            qq.textContent = q;
            span.append(qq);
        });
        parts.push(span);
    } else if (DATA.mode === "explain" && m.web === false) {
        parts.push("Without web search");
    }
    if (m.seconds) parts.push("Ready in " + Math.round(m.seconds) + " s");
    parts.push("At " + DATA.time);
    const box = $("meta");
    box.replaceChildren();
    parts.forEach((p) => {
        if (typeof p === "string") { const s = document.createElement("span"); s.textContent = p; box.append(s); }
        else box.append(p);
    });
}

document.title = ui.title + " - AI-Hotkeys";
$("title").textContent = ui.title;
renderKeys();
renderMeta();
renderMarkdown($("original"), DATA.original);
if (DATA.stream) {
    // Stream mode: the first answer arrives from /api/first (started at the end of this script)
    resultEl.innerHTML = '<p class="waiting" id="firstWaiting"></p>';
    $("firstWaiting").textContent = "The AI is reading the text.";
} else {
    renderMarkdown(resultEl, DATA.result);
}
askInput.placeholder = ui.placeholder;


/* ================= SELECTED TEXT ON THE SIDE ================= */

const page = $("page");
const railBtn = $("toggleRail");

function setRail(show) {
    page.classList.toggle("no-rail", !show);
    document.body.classList.toggle("narrow", !show);
    railBtn.setAttribute("aria-pressed", String(show));
}

if (SHORT_ORIGINAL) {
    // Short text: already in the header, the side column is not needed
    setRail(false);
    railBtn.hidden = true;
} else {
    setRail(look.mostra_originale !== "no");
    railBtn.addEventListener("click", () => setRail(page.classList.contains("no-rail")));
}


/* ================= FIX: VERSIONS AND CHANGES ================= */

function tokens(s) { return s.match(/\s+|[\p{L}\p{N}_]+|[^\s\p{L}\p{N}_]/gu) || []; }

/* Word-by-word differences (longest common subsequence). */
function diffHtml(a, b) {
    const x = tokens(a), y = tokens(b);
    if (x.length * y.length > 4_000_000) return escapeHtml(b);
    const n = x.length, m = y.length;
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--)
        for (let j = m - 1; j >= 0; j--)
            dp[i][j] = x[i] === y[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0, out = "";
    const del = [], ins = [];
    const flush = () => {
        if (del.length) out += "<del>" + escapeHtml(del.join("")) + "</del>";
        if (ins.length) out += "<ins>" + escapeHtml(ins.join("")) + "</ins>";
        del.length = 0; ins.length = 0;
    };
    while (i < n && j < m) {
        if (x[i] === y[j]) { flush(); out += escapeHtml(x[i]); i++; j++; }
        else if (dp[i + 1][j] >= dp[i][j + 1]) del.push(x[i++]);
        else ins.push(y[j++]);
    }
    while (i < n) del.push(x[i++]);
    while (j < m) ins.push(y[j++]);
    flush();
    return out;
}

function showCurrent() {
    const v = state.versions[state.current];
    if (isRewrite && state.view === "diff") {
        resultEl.classList.add("diff");
        resultEl.innerHTML = diffHtml(DATA.original.trim(), v.text.trim());
    } else {
        resultEl.classList.remove("diff");
        renderMarkdown(resultEl, v.text);
    }
}

function renderVersions() {
    const bar = $("versions");
    const note = $("versionNote");
    if (!isRewrite || state.versions.length < 2) { bar.hidden = true; note.hidden = true; return; }

    bar.replaceChildren();
    state.versions.forEach((v, i) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = "v" + (i + 1);
        b.title = v.request ? "Request: " + v.request : "First version";
        b.setAttribute("aria-pressed", String(i === state.current));
        b.addEventListener("click", () => {
            if (state.busy) return;
            state.current = i;
            showCurrent();
            renderVersions();
        });
        bar.appendChild(b);
    });
    bar.hidden = false;

    const v = state.versions[state.current];
    note.replaceChildren();
    if (v.request) {
        note.append("Version " + (state.current + 1) + ", request: ");
        const q = document.createElement("q");
        q.textContent = v.request;
        note.append(q);
        note.hidden = false;
    } else {
        note.hidden = true;
    }
}

if (isRewrite) {
    const seg = $("viewSeg");
    seg.hidden = false;
    seg.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
        if (state.busy) return;
        state.view = b.dataset.view;
        seg.querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", String(o === b)));
        showCurrent();
    }));
}


/* ================= COPY ================= */

async function copyText(text, btn) {
    try {
        await navigator.clipboard.writeText(text);
    } catch (e) {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
    }
    if (btn) {
        const label = btn.textContent;
        btn.textContent = "Copied";
        btn.classList.add("done");
        if (!state.busy) setStatus("Copied to the clipboard.");
        setTimeout(() => { btn.textContent = label; btn.classList.remove("done"); }, 1400);
    }
}

$("copyResult").addEventListener("click", (e) => {
    // The fix is copied as-is (ready to paste), the rest as plain text
    const text = isRewrite ? state.versions[state.current].text : resultEl.innerText;
    copyText(text, e.currentTarget);
});


/* ================= QUESTION BAR ================= */

function buildSuggestions() {
    const box = $("suggest");
    ui.suggest.forEach(([label, prompt]) => {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = label;
        b.title = prompt;
        b.addEventListener("click", () => {
            if (state.busy) return;
            askInput.value = prompt;
            autoGrow();
            submit();
        });
        box.appendChild(b);
    });
}
buildSuggestions();

function autoGrow() {
    askInput.style.height = "auto";
    askInput.style.height = Math.min(askInput.scrollHeight + 2, 180) + "px";
}

askInput.addEventListener("input", autoGrow);
askInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
});

form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.busy) { stopGeneration(); return; }
    submit();
});

document.addEventListener("keydown", (e) => {
    const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement?.tagName || "");
    // Esc stops the answer; the focus stays where it is
    if (e.key === "Escape") {
        if (state.busy) stopGeneration();
        return;
    }
    if (isReload(e)) { e.preventDefault(); showOffline("reload"); return; }
    if ((e.key === "/" && !typing) || (e.key.toLowerCase() === "k" && (e.ctrlKey || e.metaKey))) {
        e.preventDefault();
        askInput.focus();
    }
});

/* Messages go to a polite status line, errors to a separate alert line */
function setStatus(text, isError = false) {
    askStatus.textContent = isError ? "" : (text || "");
    askError.textContent = isError ? (text || "") : "";
}

function setBusy(busy) {
    state.busy = busy;
    form.classList.toggle("busy", busy);
    // readonly, not disabled: the field keeps the focus and stays in the tab order
    askInput.readOnly = busy;
    askInput.setAttribute("aria-disabled", String(busy));
    askSend.textContent = busy ? "Stop" : "Send";
    askSend.title = busy ? "Stop (Esc)" : "Send (Enter)";
    if (busy) setStatus(ui.busy + " Press Esc to stop it.");
}

function stopGeneration() { if (state.controller) state.controller.abort(); }


/* ================= CONVERSATION ================= */

/* While streaming, the Markdown is rendered at most once every RENDER_EVERY ms
   (C40: re-parsing on every frame is O(n^2) and breaks text selection).
   cancel() drops a pending render: the caller then does the single final one. */
const RENDER_EVERY = 150;

/* Text up to the last blank line (outside a code fence) is rendered once and kept ("frozen");
   only the paragraph being written is parsed again. The selection on earlier text survives. */
const FENCE = /^ {0,3}(```|~~~)/gm;

function markdownNodes(text) {
    const box = document.createElement("div");
    renderMarkdown(box, text);
    return [...box.childNodes];
}

function scheduleRender(el, getText) {
    let timer = 0;
    let last = 0;
    let frozen = 0;
    let tail = null;
    const run = () => {
        timer = 0;
        last = performance.now();
        const text = getText();
        if (!tail) {
            tail = document.createElement("div");
            tail.className = "tail";
            el.replaceChildren(tail);
        }
        const cut = text.lastIndexOf("\n\n");
        if (cut > frozen) {
            const part = text.slice(frozen, cut);
            if ((part.match(FENCE) || []).length % 2 === 0) {
                tail.before(...markdownNodes(part));
                frozen = cut;
            }
        }
        tail.replaceChildren(...markdownNodes(text.slice(frozen)));
    };
    return {
        request() {
            if (timer) return;
            timer = setTimeout(run, Math.max(0, RENDER_EVERY - (performance.now() - last)));
        },
        cancel() { clearTimeout(timer); timer = 0; }
    };
}

function addTurn(question) {
    const thread = $("thread");
    thread.hidden = false;

    const n = thread.querySelectorAll(".turn").length + 1;
    const turn = document.createElement("section");
    turn.className = "turn";
    turn.setAttribute("aria-label", "Question " + n);
    turn.innerHTML = `
        <div class="ask-line"><p></p><button type="button" class="btn" data-copy>Copy</button></div>
        <div class="md"><p class="waiting">The AI is reading the question.</p></div>`;
    turn.querySelector(".ask-line p").textContent = question;
    turn.querySelector("[data-copy]").setAttribute("aria-label", "Copy answer " + n);
    const content = turn.querySelector(".md");
    turn.querySelector("[data-copy]").addEventListener("click", (e) => copyText(content.innerText, e.currentTarget));

    thread.appendChild(turn);
    requestAnimationFrame(() => turn.scrollIntoView({ behavior: "smooth", block: "start" }));
    return content;
}

/* Calls onMessage for each line of an NDJSON response body */
async function readNdjson(res, onMessage) {
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let nl;
        while ((nl = buffer.indexOf("\n")) >= 0) {
            const line = buffer.slice(0, nl).trim();
            buffer = buffer.slice(nl + 1);
            if (line) onMessage(JSON.parse(line));
        }
    }
}

async function submit() {
    const question = askInput.value.trim();
    if (!question || state.busy || state.locked) return;

    const base = state.current;
    let text = "";
    let target;

    if (isRewrite) {
        state.view = "result";
        $("viewSeg").querySelectorAll("button").forEach((o) => o.setAttribute("aria-pressed", String(o.dataset.view === "result")));
        resultEl.classList.remove("diff");
        target = resultEl;
        resultEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
        target = addTurn(question);
    }

    const rerender = scheduleRender(target, () => text);
    target.setAttribute("aria-busy", "true");

    askInput.value = "";
    autoGrow();
    setBusy(true);

    const controller = new AbortController();
    state.controller = controller;
    let finished = false;
    let errorMsg = null;
    let partial = false;

    try {
        const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json", "X-Token": DATA.token },
            body: JSON.stringify({ question, base }),
            signal: controller.signal
        });
        if (res.status === 403) { showOffline("gone"); throw new Error(OFFLINE_TEXT.gone); }
        if (!res.ok || !res.body) {
            let msg = "The server responded with error " + res.status + ".";
            try { msg = (await res.json()).error || msg; } catch (e) {}
            throw new Error(msg);
        }
        let first = true;
        await readNdjson(res, (msg) => {
            if (msg.error) { errorMsg = msg.error; partial = !!msg.partial; return; }
            if (msg.t) {
                if (first) { first = false; target.classList.add("streaming"); }
                text += msg.t;
                rerender.request();
            }
            if (msg.done) { finished = true; text = msg.text; }
        });
    } catch (e) {
        if (e.name === "AbortError") errorMsg = "__abort__";
        else if (e instanceof TypeError) { errorMsg = OFFLINE_TEXT.gone; showOffline("gone"); }
        else errorMsg = e.message || String(e);
    } finally {
        state.controller = null;
        rerender.cancel();
        target.classList.remove("streaming");
        target.removeAttribute("aria-busy");
        setBusy(false);
    }

    if (finished) {
        renderMarkdown(target, text);
        if (isRewrite) {
            state.versions.push({ text, request: question });
            state.current = state.versions.length - 1;
            renderVersions();
        }
        setStatus(isRewrite ? "New version ready: v" + state.versions.length + "." : "Answer ready.");
        askInput.focus({ preventScroll: true });
        return;
    }

    // Stopped or error
    if (isRewrite) {
        showCurrent();
        askInput.value = question;
        autoGrow();
    } else if (!text) {
        target.innerHTML = '<p class="' + (errorMsg === "__abort__" ? "waiting" : "error-text") + '"></p>';
        target.firstChild.textContent = errorMsg === "__abort__" ? "Stopped before the answer." : (errorMsg || "No answer.");
    } else {
        renderMarkdown(target, text + (errorMsg === "__abort__" ? "\n\n*Stopped here.*" : ""));
        if (errorMsg !== "__abort__") markIncomplete(target, partial);
    }

    if (errorMsg === "__abort__") {
        setStatus(isRewrite ? "Stopped. The current version has not changed." : "Stopped.");
        setTimeout(() => { if (!state.busy) setStatus(""); }, 2500);
    } else {
        let msg = errorMsg || "The AI did not answer. Check that Ollama is running.";
        if (isRewrite && text) msg += " The incomplete draft was not kept: the current version has not changed.";
        else if (text) msg += " The answer above is incomplete.";
        setStatus(msg, true);
    }
}

/* An answer cut off by Ollama (K4 "partial") or by an error stays visible, marked as incomplete */
function markIncomplete(target, partial) {
    const note = document.createElement("p");
    note.className = "partial-note";
    const b = document.createElement("strong");
    b.textContent = "Incomplete answer.";
    note.append(b, partial ? " Ollama stopped before the end: ask again to get the full answer."
                           : " An error interrupted it: ask again to get the full answer.");
    target.appendChild(note);
}


/* ================= FIRST ANSWER, STREAMED (stream mode) ================= */

/* The page opens as soon as the key is pressed and asks once for the first answer
   (the server refuses a second time: a reload never generates again). Stop and Esc stop
   it, and so does holding Esc for 2 s anywhere (main.ahk drops a cancel flag the server sees). */
function showFirstStatus(text) {
    const waiting = $("firstWaiting");
    if (waiting) waiting.textContent = text;
    setStatus(text + " Press Esc to stop it.");
}

/* After a first answer that did not finish there is nothing to ask about */
function lockComposer() {
    state.locked = true;
    askInput.readOnly = true;
    askInput.setAttribute("aria-disabled", "true");
    askInput.placeholder = "To start again, select the text and press the hotkey.";
    askSend.disabled = true;
    $("suggest").hidden = true;
}

async function streamFirst() {
    let text = "";
    const rerender = scheduleRender(resultEl, () => text);
    resultEl.setAttribute("aria-busy", "true");
    setBusy(true);

    const controller = new AbortController();
    state.controller = controller;
    let finished = false;
    let errorMsg = null;
    let partial = false;

    try {
        const res = await fetch("/api/first", {
            method: "POST",
            headers: { "X-Token": DATA.token },
            signal: controller.signal
        });
        if (res.status === 403) { showOffline("gone"); throw new Error(OFFLINE_TEXT.gone); }
        if (!res.ok || !res.body) {
            let msg = "The server responded with error " + res.status + ".";
            try { msg = (await res.json()).error || msg; } catch (e) {}
            throw new Error(msg);
        }
        let first = true;
        await readNdjson(res, (msg) => {
            if (msg.status) { if (first) showFirstStatus(msg.status); return; }
            if (msg.error) { errorMsg = msg.cancelled ? "__abort__" : msg.error; partial = !!msg.partial; return; }
            if (msg.t) {
                if (first) {
                    first = false;
                    resultEl.classList.add("streaming");
                    setStatus("The AI is writing. Press Esc to stop it.");
                }
                text += msg.t;
                rerender.request();
            }
            if (msg.done) { finished = true; text = msg.text; DATA.meta = msg.meta || {}; }
        });
    } catch (e) {
        if (e.name === "AbortError") errorMsg = "__abort__";
        else if (e instanceof TypeError) { errorMsg = OFFLINE_TEXT.gone; showOffline("gone"); }
        else errorMsg = e.message || String(e);
    } finally {
        state.controller = null;
        rerender.cancel();
        resultEl.classList.remove("streaming");
        resultEl.removeAttribute("aria-busy");
        setBusy(false);
    }

    state.versions[0].text = text;
    if (finished) {
        showCurrent();
        renderMeta();
        setStatus("Answer ready.");
        askInput.focus({ preventScroll: true });
        return;
    }

    // Stopped (Stop, Esc, Esc 2 s) or error: what was written stays, marked
    const stopped = errorMsg === "__abort__";
    if (!text) {
        resultEl.innerHTML = '<p class="' + (stopped ? "waiting" : "error-text") + '"></p>';
        resultEl.firstChild.textContent = stopped ? "Stopped before the answer." : (errorMsg || "No answer.");
    } else {
        renderMarkdown(resultEl, text + (stopped ? "\n\n*Stopped here.*" : ""));
        if (!stopped) markIncomplete(resultEl, partial);
    }
    lockComposer();
    if (stopped) setStatus("Stopped. To start again, select the text and press the hotkey.");
    else setStatus((errorMsg || "The AI did not answer. Check that Ollama is running.")
                   + (text ? " The answer above is incomplete." : ""), true);
}


/* ================= CONNECTION TO THE SERVER ================= */

const OFFLINE_TEXT = {
    gone: "This page is no longer connected to AI-Hotkeys. Select the text again and press the hotkey to open a new one.",
    reload: "This page cannot be reloaded: reloading would disconnect it. To start again, select the text and press the hotkey."
};

/* Banner at the top: the server is gone (ping failed, idle shutdown) or the user tried to reload
   (the token was removed from the address, so a reload could not open the page again). */
function showOffline(kind) {
    const box = $("offline");
    box.replaceChildren();
    const b = document.createElement("strong");
    b.textContent = kind === "reload" ? "Reload not available. " : "Disconnected. ";
    box.append(b, OFFLINE_TEXT[kind]);
    box.hidden = false;
}

function isReload(e) {
    return e.key === "F5" || ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === "r");
}

function ping() {
    fetch("/api/ping", { headers: { "X-Token": DATA.token }, cache: "no-store" })
        .then((res) => { if (!res.ok) showOffline("gone"); })
        .catch(() => showOffline("gone"));
}
setInterval(ping, 15000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) ping(); });

if (DATA.stream) streamFirst();
</script>
