; =========================================================
;  AI-Hotkeys — configuration
;  After editing: AI-Hotkeys tray icon -> "Reload"
; =========================================================

[qwen]
; (The section is called [qwen] for historical reasons; it works with any model.)
; Ollama model to use (download it with: ollama pull gemma4:e4b-it-qat)
; Needs Ollama 0.9.0 or newer. Every setting is described in
; docs/CONFIGURATION.md in the AI-Hotkeys repository on GitHub.
;
; "gemma4:e4b-it-qat" is Gemma 4 E4B, quantization-aware trained (QAT): about
; 6 GB to download and about 3-4 GB of VRAM, so it fits 8 GB cards comfortably.
; On AI-Hotkeys' own tasks it passed 98.5% of the checks at about 75 tokens/s
; (RTX 3060 12 GB), about twice as fast per task as qwen3.5:9b.
; Other choices:
;   gemma4:e2b-it-qat  light: 4.3 GB download, about 1.7 GB VRAM, ~2x faster, but
;                      shallower explanations. For GPUs with 4 GB or less, or no GPU
;   gemma4:12b-it-qat  maximum quality (100%), about 7.4 GB VRAM, ~2x slower
;   qwen3.5:9b         the previous default, still works (79.5%, ~5.7 GB VRAM)
; An upgrade keeps the model already written here: to switch, change it,
; run  ollama pull <model>  and reload.
model = gemma4:e4b-it-qat
ollama_url = http://localhost:11434

; How long Ollama keeps the model ready in memory after the last request.
; Ollama's default is 5 minutes: after that time the model is
; unloaded and the next keypress waits for the reload (10-20 s).
; While the model is in memory it occupies VRAM (about 3-4 GB with context
; for the default model),
; but does NOT use the GPU: load hits 100% only in the seconds while it writes.
; To free VRAM before gaming: right-click the ✦ icon in the
; taskbar -> "Free VRAM".
;   30m  = ready for half an hour (recommended)
;   10m  = compromise if you also use the GPU for other things
;   -1   = always ready, never unloads by itself
;   0    = unloads as soon as finished, every keypress pays the loading cost
keep_alive = 30m

[searxng]
; Web search for the End key (explain): before explaining, AI-Hotkeys
; searches the web with SearXNG, reads the top pages and passes them to the AI.
; In the explanation, information taken from the web carries the
; source number, [1] [2]..., clickable, with the source list at the bottom.
;
; SearXNG runs on your PC (searxng folder) and starts together with AI-Hotkeys.
; It can also be used from the browser: http://127.0.0.1:8888
;
; Not every text is searched: first the AI decides whether there is anything to search.
; For a thought, an opinion or a personal note it is not needed, and pages
; found by force would push the explanation off topic.
;   web_search = auto    search only when needed (recommended)
;   web_search = always  always search, even when not needed
;   web_search = false   never: End explains using only the selected text
web_search = auto
searxng_url = http://127.0.0.1:8888

; What leaves this PC: SearXNG runs here, but it sends the search words to
; public search engines (Startpage, Yahoo), and the pages found are then
; downloaded from their websites. Your full text and the AI's answer stay here.
; query_mode chooses where the search words may come from (Settings page:
; "Search words"):
;   query_mode = allow_fallback  the AI writes them; if a search is forced
;                                (technical terms, or web_search = always) and
;                                the AI writes none, the technical terms found in
;                                the text, or its first 10 words, are searched
;                                (default)
;   query_mode = model           only words written by the AI: nothing is ever
;                                taken verbatim from your text; without them,
;                                no search
query_mode = allow_fallback

; How many results to pass to the AI and for how many to read the full page
; (the others with preview only). More pages = more context but slower.
results = 5
pages_to_read = 3

[aspetto]
; Look of the results and settings page.
; Easiest to change from: AI-Hotkeys icon -> Settings.
;   tema      scuro, nero, chiaro, sistema (follows Windows)
;   colore    ambra, ghiaccio, menta, corallo, viola, neutro
;   testo     text size in pixels, from 14 to 20
;   larghezza reading column width: stretta, normale, ampia
tema = scuro
colore = ambra
testo = 16
larghezza = normale
; Selected text shown next to the result (si / no)
mostra_originale = si
; Bubble near the mouse while the AI is working (si / no)
avanzamento = si

[tasti]
; Keys for the three actions, in AutoHotkey syntax:
;   ^ = Ctrl   ! = Alt   + = Shift   # = Win      e.g. ^!r = Ctrl+Alt+R
; Letters and numbers alone are not allowed: they are needed for typing.
correggi = PgUp
riassumi = PgDn
spiega = End

[comportamento]
; PgUp directly replaces the selected text in Notepad,
; Obsidian, Word, VS Code and Notepad++ (si). With "no" it opens the page.
; PgDn and End always open the results page.
sostituisci_testo = si
; Length of summaries and explanations: breve, normale, dettagliata
lunghezza = normale

; Optional: how long a key waits for the copied selection, in milliseconds
; (100 to 10000, default 2000). With nothing selected the key does its normal
; job after this time. Lower it (e.g. 500) for a snappier key; raise it if
; Excel or a remote desktop copies slowly. Remove the ";" to use it.
; clip_wait_ms = 2000

[obsidian]
; File that PgUp reorganizes when it is open in Obsidian
; Example: todo_file = %USERPROFILE%\Documents\To-Do List.md
todo_file = %USERPROFILE%\Documents\To-Do List.md

; Start of the Obsidian window title when that file is open:
; "<note name> - <vault name> - Obsidian"
; Example: window_title = To-Do List - IlMioVault - Obsidian
window_title = To-Do List -
