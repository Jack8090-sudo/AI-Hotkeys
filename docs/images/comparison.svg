<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Built-in model compared with Gemma 4 E4B: size, memory, speed and quality (where Gemma is still better: explanations built on long web pages)</title>
  <rect width="880" height="356" rx="18" fill="#0d1117"/>
  <text x="32" y="40" font-size="18" font-weight="700" fill="#e6edf3">Built-in model vs Gemma 4 E4B (Ollama)</text>
  <g font-size="12" fill="#8b949e">
    <rect x="560" y="28" width="14" height="14" rx="3" fill="#5eead4"/><text x="580" y="40">Built-in LFM (2.0)</text>
    <rect x="712" y="28" width="14" height="14" rx="3" fill="#6e7681"/><text x="732" y="40">Gemma 4 E4B (1.1)</text>
  </g>

  <!-- rows: label, lfm bar, gemma bar (bars scaled per row, 520 px = the larger value) -->
  <g font-size="14" fill="#e6edf3">
    <text x="32" y="86">Download</text>
    <rect x="210" y="72" width="17" height="14" rx="3" fill="#5eead4"/><text x="235" y="84" font-size="12" fill="#5eead4">0.19 GB</text>
    <rect x="210" y="90" width="520" height="14" rx="3" fill="#6e7681"/><text x="738" y="102" font-size="12" fill="#8b949e">6 GB</text>

    <text x="32" y="138">Memory in use</text>
    <rect x="210" y="124" width="74" height="14" rx="3" fill="#5eead4"/><text x="292" y="136" font-size="12" fill="#5eead4">0.5 GB</text>
    <rect x="210" y="142" width="520" height="14" rx="3" fill="#6e7681"/><text x="738" y="154" font-size="12" fill="#8b949e">3.5 GB VRAM</text>

    <text x="32" y="190">Speed (tokens/s)</text>
    <rect x="210" y="176" width="520" height="14" rx="3" fill="#5eead4"/><text x="738" y="188" font-size="12" fill="#5eead4">~500</text>
    <rect x="210" y="194" width="78" height="14" rx="3" fill="#6e7681"/><text x="296" y="206" font-size="12" fill="#8b949e">~75</text>

    <text x="32" y="242">Quality (app tests)</text>
    <rect x="210" y="228" width="504" height="14" rx="3" fill="#5eead4"/><text x="722" y="240" font-size="12" fill="#5eead4">96%</text>
    <rect x="210" y="246" width="509" height="14" rx="3" fill="#6e7681"/><text x="727" y="258" font-size="12" fill="#8b949e">97%</text>

    <text x="32" y="294">Explain with web pages</text>
    <rect x="210" y="280" width="403" height="14" rx="3" fill="#5eead4"/><text x="621" y="292" font-size="12" fill="#5eead4">77%</text>
    <rect x="210" y="298" width="524" height="14" rx="3" fill="#6e7681"/><text x="742" y="310" font-size="12" fill="#8b949e">100%</text>
  </g>
  <text x="32" y="338" font-size="11" fill="#8b949e">RTX 3060 12 GB. On the processor alone the built-in model still writes ~200 tokens/s. Details: docs/audit/model-choice-2026-11.md</text>
</svg>
