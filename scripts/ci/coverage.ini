# Coverage settings for CI (S2). Used as:
#   coverage run --rcfile=scripts/ci/coverage.ini -m unittest discover -s tests -t .
#   python scripts/ci/coverage_remap.py
#   coverage report --rcfile=scripts/ci/coverage.ini --fail-under=<baseline>
#
# Why not [tool.coverage] in pyproject.toml: the tests import the app from a temporary copy
# (tests/support.py AppTree -> %TEMP%\aihk-test-<random>\), so "source = ." measures nothing.
# We measure the copies too; coverage_remap.py then maps them back onto the repo files. (A [paths]
# alias cannot do it: coverage rejects aliases that end in a wildcard, and the dir name is random.)
[run]
branch = true
include =
    */aihk-test-*/*
    ./*
# Patterns that do not start with a wildcard are relative to the repo root (the working directory).
omit =
    tests/*
    python/*
    searxng/*
    build/*
    tools/*
    scripts/*
    .claude/*
    test_*.py

[report]
skip_empty = true
precision = 1

[xml]
output = coverage.xml
