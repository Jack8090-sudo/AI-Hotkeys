# =========================================================
#  SearXNG for AI-Hotkeys
#  Starts from SearXNG defaults and changes
#  only what a personal use on your PC needs.
#
#  Port and address are NOT changed here: change them in
#  config.ini, [searxng] section, "searxng_url" line.
# =========================================================

use_default_settings:
  engines:
    # Engines not needed or not working on a normal PC
    # (ahmia and torch require Tor).
    remove:
      - ahmia
      - torch
      - radio browser

general:
  instance_name: "SearXNG · AI-Hotkeys"
  enable_metrics: false

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "auto"
  # json is for AI-Hotkeys; html to also use it from the browser
  # (http://127.0.0.1:8888 or http://localhost:8888: the launcher answers
  # 403 to any other Host name, which blocks DNS-rebinding pages)
  formats:
    - html
    - json

server:
  # From your PC only: nobody else on the network can use it.
  # (avvia_searxng.py always binds 127.0.0.1 itself, exclusively.)
  bind_address: "127.0.0.1"
  limiter: false
  public_instance: false
  image_proxy: false

ui:
  default_locale: "it"
  query_in_title: true

engines:
  # Tested from your PC (October 2026): Google (google cse),
  # Startpage and Yahoo respond well. DuckDuckGo asks for CAPTCHA, Brave blocks for
  # "too many requests", Wikidata always times out: off.
  - name: startpage
    inactive: false
    disabled: false
  - name: yahoo
    disabled: false
  - name: duckduckgo
    disabled: true
  - name: brave
    disabled: true
  - name: wikidata
    disabled: true
  # Loaded but off: can be used from the browser with "!mjk"
  - name: mojeek
    inactive: false
    disabled: true
